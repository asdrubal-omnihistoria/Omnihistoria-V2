<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>OMNIH - Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/omnih-base.css">
  <style>
    :root {
      --bg-canvas: #edf2f7;
      --active-blue: #3182ce;
      --error-red: #e53e3e;
      --border-color: #e2e8f0;
      --text-dark: #1a202c;
      --text-muted: #718096;
      --accent-gold: #d69e2e;
    }

    body {
      background-color: var(--bg-canvas);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      position: relative;
      padding: 1.5rem 1.25rem;
      margin: auto;
    }

    @media (max-width: 640px) {
      .container {
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
        padding: 14px;
      }
    }

    .top-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .dna-box {
      width: 32px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .dna-icon {
      width: 32px;
      height: 44px;
      transform: rotate(45deg);
      display: block;
    }

    .text-omnih {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 35%, #ca8a04 70%, #854d0e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .btn-top-register {
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-top-register:hover {
      border-color: var(--active-blue);
      color: var(--active-blue);
      background-color: #f8fafc;
    }

    .protocol-subbar {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .header-protocol-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      background: #ffffff;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #63b3ed;
      box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.2);
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .error-banner {
      display: none;
      background-color: #fff5f5;
      color: var(--error-red);
      border: 1px solid #feb2b2;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #90cdf4 0%, #bee3f8 50%, #ffffff 100%);
      color: #1a365d;
      border: 1px solid #90cdf4;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(144, 205, 244, 0.35);
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #bee3f8 0%, #ebf8ff 60%, #ffffff 100%);
      color: var(--active-blue);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .quote-box {
      background-color: #f8fafc;
      border-left: 4px solid var(--accent-gold);
      padding: 12px 14px;
      margin-top: 24px;
      border-radius: 0 8px 8px 0;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .quote-text {
      font-style: italic;
      color: var(--text-muted);
    }

    .quote-source {
      display: block;
      margin-top: 6px;
      font-weight: 700;
      color: var(--accent-gold);
    }
  </style>

  <!-- SDK oficial de Supabase mediante CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
  
  <header class="top-navbar">
    <a href="/" class="brand-logo-link" title="Ir a la Raíz">
      <div class="dna-box">
        <svg viewBox="0 0 120 240" width="32" height="44" preserveAspectRatio="xMidYMid meet" class="dna-icon" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="hebraFondo" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#b03a8a" />
              <stop offset="35%" stop-color="#704fa0" />
              <stop offset="70%" stop-color="#3b7cb3" />
              <stop offset="100%" stop-color="#4aa47a" />
            </linearGradient>
            <linearGradient id="hebraFrente" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#d95438" />
              <stop offset="100%" stop-color="#eab308" />
            </linearGradient>
          </defs>
          <path d="M30,20 Q90,70 30,120 T30,220" fill="none" stroke="url(#hebraFondo)" stroke-width="16" stroke-linecap="round" />
          <path d="M90,20 Q30,70 90,120 T90,220" fill="none" stroke="url(#hebraFrente)" stroke-width="16" stroke-linecap="round" />
        </svg>
      </div>
      <span class="text-omnih">OMNIH</span>
    </a>
    <a href="/registro" class="btn-top-register">REGISTRARSE</a>
  </header>

  <div class="protocol-subbar">
    <span class="header-protocol-text">PROTOCOLO DE INICIO DE SESIÓN</span>
  </div>

  <main class="form-body">
    <!-- Mensaje de error para credenciales incorrectas o fallo de red -->
    <div id="errorAlert" class="error-banner" role="alert"></div>

    <form id="formLogin" novalidate>
      <div class="form-group">
        <label for="loginEmail">Correo Electrónico</label>
        <input type="email" id="loginEmail" name="email" placeholder="correo@ejemplo.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="btnTogglePassword" class="btn-toggle-pwd" aria-label="Mostrar u ocultar contraseña">Ver</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnLoginSubmit">INICIAR SESIÓN</button>
    </form>
  </main>

  <aside class="quote-box">
    <p class="quote-text">"Bienvenido, sumando para compilar la historia del futuro."</p>
    <span class="quote-source">— Comunidad de la Omnihistoria</span>
  </aside>

</div>

<script>
  // 1. Configuración de credenciales de Supabase
  const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
  const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener('DOMContentLoaded', async () => {
    const form = document.getElementById('formLogin');
    const emailInput = document.getElementById('loginEmail');
    const pwdInput = document.getElementById('loginPassword');
    const btnSubmit = document.getElementById('btnLoginSubmit');
    const togglePwdBtn = document.getElementById('btnTogglePassword');
    const errorAlert = document.getElementById('errorAlert');

    // Comprobar si ya existe una sesión activa y redirigir
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = '/central';
      return;
    }

    // Alternar visibilidad de contraseña
    togglePwdBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      togglePwdBtn.textContent = isPwd ? 'Ocultar' : 'Ver';
    });

    function showError(message) {
      errorAlert.textContent = message;
      errorAlert.style.display = 'block';
    }

    function clearError() {
      errorAlert.textContent = '';
      errorAlert.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'AUTENTICANDO...';

      const email = emailInput.value.trim();
      const password = pwdInput.value;

      try {
        // Autenticación real enviando credenciales al servidor seguro
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          // Errores comunes: credenciales inválidas, usuario no confirmado, etc.
          if (error.message.includes('Invalid login credentials')) {
            showError('El correo electrónico o la contraseña son incorrectos.');
          } else if (error.message.includes('Email not confirmed')) {
            showError('Debes confirmar tu correo electrónico antes de ingresar.');
          } else {
            showError(error.message || 'Error al iniciar sesión.');
          }
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'INICIAR SESIÓN';
          return;
        }

        // Éxito: el SDK almacena el token JWT de forma segura y redirige
        window.location.href = '/central';

      } catch (err) {
        console.error('Error de conexión:', err);
        showError('No se pudo conectar con el servidor de autenticación.');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'INICIAR SESIÓN';
      }
    });
  });
</script>
</body>
</html>
