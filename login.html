<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OMNIH - Acceso</title>
  <style>
    :root {
      --bg-canvas: #edf2f7;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --accent-gold: #c5a059;
      --border-color: #e2e8f0;
      --active-blue: #3182ce;
      --error-red: #e53e3e;
      --success-green: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-canvas);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0;
    }

    /* Móvil: pantalla completa */
    .container {
      background-color: var(--card-bg);
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }

    .top-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .dna-box {
      width: 32px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .dna-icon {
      width: 32px;
      height: 44px;
      transform: rotate(45deg);
      display: block;
    }

    .text-omnih {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 35%, #ca8a04 70%, #854d0e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .btn-top-login {
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-top-login:hover {
      border-color: var(--active-blue);
      color: var(--active-blue);
      background-color: #f8fafc;
    }

    .protocol-subbar {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .header-protocol-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
    }

    .form-body {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      color: var(--text-dark);
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #63b3ed;
      box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.25);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-error, .form-info {
      display: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.4;
      margin-top: 4px;
    }

    .form-error {
      background-color: #fff5f5;
      border: 1px solid #feb2b2;
      color: var(--error-red);
    }

    .form-info {
      background-color: #f0fff4;
      border: 1px solid #9ae6b4;
      color: #276749;
    }

    .form-error.active, .form-info.active {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #90cdf4 0%, #bee3f8 50%, #ffffff 100%);
      color: #1a365d;
      border: 1px solid #90cdf4;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #bee3f8 0%, #ebf8ff 60%, #ffffff 100%);
      color: var(--active-blue);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .links-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-link {
      background: none;
      border: none;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--active-blue);
      cursor: pointer;
      text-decoration: none;
    }

    .btn-link:hover {
      text-decoration: underline;
    }

    .btn-link.hidden {
      display: none;
    }

    .quote-box {
      background-color: #f8fafc;
      border-left: 4px solid var(--accent-gold);
      padding: 12px 14px;
      margin-top: auto;
      border-radius: 0 8px 8px 0;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .quote-text {
      font-style: italic;
      color: var(--text-muted);
    }

    .quote-source {
      display: block;
      margin-top: 6px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    /* Escritorio: tarjeta centrada */
    @media (min-width: 600px) {
      body {
        align-items: center;
        padding: 1rem;
      }
      .container {
        max-width: 480px;
        min-height: 0;
        border-radius: 24px;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        padding: 1.5rem 1.25rem;
      }
      .quote-box {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <header class="top-navbar">
    <a href="index.html" class="brand-logo-link" title="Ir a la Raíz de la Omnihistoria">
      <div class="dna-box">
        <svg viewBox="0 0 120 240" width="32" height="44" preserveAspectRatio="xMidYMid meet" class="dna-icon" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="hebraFondo" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#b03a8a" />
              <stop offset="35%" stop-color="#704fa0" />
              <stop offset="70%" stop-color="#3b7cb3" />
              <stop offset="100%" stop-color="#4aa47a" />
            </linearGradient>
            <linearGradient id="hebraFrente" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#d95438" />
              <stop offset="100%" stop-color="#eab308" />
            </linearGradient>
          </defs>
          <path d="M30,20 Q90,70 30,120 T30,220" fill="none" stroke="url(#hebraFondo)" stroke-width="16" stroke-linecap="round" />
          <path d="M90,20 Q30,70 90,120 T90,220" fill="none" stroke="url(#hebraFrente)" stroke-width="16" stroke-linecap="round" />
        </svg>
      </div>
      <span class="text-omnih">OMNIH</span>
    </a>
    <a href="registro.html" class="btn-top-login">REGISTRARSE</a>
  </header>

  <div class="protocol-subbar">
    <span class="header-protocol-text">ACCESO AL REPOSITORIO</span>
  </div>

  <main class="form-body">
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="input-email">Correo Electrónico</label>
        <input type="email" id="input-email" name="email" required autocomplete="email" placeholder="nombre@ejemplo.org">
      </div>

      <div class="form-group">
        <label for="input-password">Contraseña Soberana</label>
        <div class="input-wrapper">
          <input type="password" id="input-password" name="password" required autocomplete="current-password" placeholder="Tu contraseña">
          <button type="button" id="btnTogglePassword" class="btn-toggle-pwd" aria-label="Mostrar u ocultar contraseña">Ver</button>
        </div>
      </div>

      <div id="formInfo" class="form-info" role="status"></div>
      <div id="formError" class="form-error" role="alert"></div>

      <button type="submit" id="btnSubmit" class="btn-submit">INGRESAR</button>

      <div class="links-row">
        <button type="button" id="btnReenviar" class="btn-link hidden">Reenviar correo de verificación</button>
        <button type="button" id="btnOlvide" class="btn-link">Olvidé mi contraseña</button>
        <a href="registro.html" class="btn-link">¿Aún no tienes cuenta? Regístrate</a>
      </div>
    </form>
  </main>

  <aside class="quote-box">
    <p class="quote-text">"La preservación de la identidad digital no es un derecho opcional; es la piedra angular del ecosistema de legado ontológico."</p>
    <span class="quote-source">— Manual de Arquitectura OMNIH</span>
  </aside>

</div>

<script type="module">
  import { ingresar, reenviarVerificacion, mensajeError } from "./js/guardian.js";
  import { getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('input-email');
  const pwdInput = document.getElementById('input-password');
  const togglePwdBtn = document.getElementById('btnTogglePassword');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnReenviar = document.getElementById('btnReenviar');
  const btnOlvide = document.getElementById('btnOlvide');
  const formError = document.getElementById('formError');
  const formInfo = document.getElementById('formInfo');

  function mostrarError(msg) {
    formInfo.classList.remove('active');
    formError.textContent = msg;
    formError.classList.add('active');
  }

  function mostrarInfo(msg) {
    formError.classList.remove('active');
    formInfo.textContent = msg;
    formInfo.classList.add('active');
  }

  function limpiar() {
    formError.classList.remove('active');
    formInfo.classList.remove('active');
  }

  // Aviso si la sesión se cerró por inactividad
  if (new URLSearchParams(location.search).get('motivo') === 'inactividad') {
    mostrarInfo('Tu sesión se cerró por inactividad. Ingresa de nuevo.');
  }

  togglePwdBtn.addEventListener('click', () => {
    const isPwd = pwdInput.type === 'password';
    pwdInput.type = isPwd ? 'text' : 'password';
    togglePwdBtn.textContent = isPwd ? 'Ocultar' : 'Ver';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    limpiar();
    btnReenviar.classList.add('hidden');

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = 'VERIFICANDO...';

    try {
      await ingresar(emailInput.value.trim().toLowerCase(), pwdInput.value);
      window.location.replace('central.html');
    } catch (err) {
      console.error('Error de acceso:', err);
      mostrarError(mensajeError(err));
      if (err && err.message === 'correo_no_verificado') {
        btnReenviar.classList.remove('hidden');
      }
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'INGRESAR';
    }
  });

  btnReenviar.addEventListener('click', async () => {
    limpiar();
    const correo = emailInput.value.trim().toLowerCase();
    if (!correo || !pwdInput.value) {
      mostrarError('Escribe tu correo y tu contraseña para reenviar el mensaje.');
      return;
    }
    try {
      await reenviarVerificacion(correo, pwdInput.value);
      mostrarInfo('Te enviamos un nuevo correo de verificación. Revisa también el spam.');
    } catch (err) {
      mostrarError(mensajeError(err));
    }
  });

  btnOlvide.addEventListener('click', async () => {
    limpiar();
    const correo = emailInput.value.trim().toLowerCase();
    if (!correo) {
      mostrarError('Escribe tu correo arriba y pulsa de nuevo "Olvidé mi contraseña".');
      return;
    }
    try {
      await sendPasswordResetEmail(getAuth(getApp()), correo);
      mostrarInfo('Si ese correo está registrado, recibirás un mensaje para restablecer tu contraseña.');
    } catch (err) {
      mostrarError(mensajeError(err));
    }
  });
</script>

</body>
</html>
